{% extends "base.html" %}

{% block title %}
Add Student
{% endblock %}

{% block content %}

<h2 class="mb-4">
    Add New Student
</h2>


<form method="POST">

    <div class="row">

        <div class="col-md-6 mb-3">

            <label>
                Full Name *
            </label>

            <input
                type="text"
                name="name"
                class="form-control"
                required>

        </div>


        <div class="col-md-6 mb-3">

            <label>
                Email *
            </label>

            <input
                type="email"
                name="email"
                class="form-control"
                required>

        </div>


        <div class="col-md-6 mb-3">

            <label>
                Phone *
            </label>

            <input
                type="tel"
                name="phone"
                class="form-control"
                required>

        </div>


        <div class="col-md-6 mb-3">

            <label>
                Course *
            </label>

            <input
                type="text"
                name="course"
                class="form-control"
                placeholder="e.g. Python Development"
                required>

        </div>


        <div class="col-md-6 mb-3">

            <label>
                Gender *
            </label>

            <select
                name="gender"
                class="form-select"
                required>

                <option value="">
                    Select Gender
                </option>

                <option value="Male">
                    Male
                </option>

                <option value="Female">
                    Female
                </option>

            </select>

        </div>


        <div class="col-md-6 mb-3">

            <label>
                Date of Birth
            </label>

            <input
                type="date"
                name="date_of_birth"
                class="form-control">

        </div>


        <div class="col-md-12 mb-3">

            <label>
                Address
            </label>

            <textarea
                name="address"
                class="form-control"
                rows="3">
            </textarea>

        </div>

    </div>


    <button
        type="submit"
        class="btn btn-success">

        Save Student

    </button>


    <a
        href="{{ url_for('students') }}"
        class="btn btn-secondary">

        Cancel

    </a>

</form>

{% endblock %}
